name: Sync Coding Progress

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # ← full history fetch karo
          token: ${{ secrets.GITHUB_TOKEN }}  # ← explicit token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch stats from all platforms
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          HACKERRANK_USERNAME: ${{ secrets.HACKERRANK_USERNAME }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          STRATASCRATCH_USERNAME: ${{ secrets.STRATASCRATCH_USERNAME }}
          STRATASCRATCH_PASSWORD: ${{ secrets.STRATASCRATCH_PASSWORD }}
        run: python scripts/fetch_stats.py

      - name: Update progress.md
        run: python scripts/update_progress.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          git add progress.md stats.json
          git diff --staged --quiet || git commit -m "Auto-sync coding progress $(date +'%Y-%m-%d')"
          git push origin main